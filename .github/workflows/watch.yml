name: watch
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: save state
        run: |
          git add state.json
          if ! git diff --cached --quiet; then
            git config user.name "nhm-watcher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "state"
            git push
          fi
